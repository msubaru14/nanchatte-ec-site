root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/api"
entrypoint = "./tmp/main"
delay = 1000
exclude_dir = ["tmp", "vendor"]
exclude_file = []
exclude_regex = ["_test\\.go"]
include_dir = []
include_ext = ["go", "tpl", "tmpl", "html"]
kill_delay = "0s"
log = "build-errors.log"
poll = true
poll_interval = 500
send_interrupt = false
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
