openapi: 3.0.3
info:
  title: Nanchatte EC Site API
  version: 0.1.0
  description: |
    なんちゃってECサイトのAPI仕様。
    このファイルには実装済みAPIから順次追記する。
servers:
  - url: http://localhost:8080
    description: Local backend
tags:
  - name: Auth
    description: Authentication APIs
  - name: Products
    description: Public product APIs
  - name: Cart
    description: Authenticated customer cart APIs
  - name: Orders
    description: Authenticated customer order APIs
  - name: Reviews
    description: Product review APIs
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register user
      description: |
        ユーザー登録を行う。

        登録時に email を正規化し、password を hash 化して保存する。
        初期 role として customer を付与し、cart を作成する。
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              default:
                value:
                  name: Alice
                  email: alice@example.com
                  password: secret123
      responses:
        "201":
          description: Register success response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      user:
                        id: 1
                        name: Alice
                        email: alice@example.com
                        roles:
                          - customer
                      tokens:
                        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                        refreshToken: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                        tokenType: Bearer
                        expiresIn: 900
                    error: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailAlreadyExists:
                  value:
                    data: null
                    error:
                      code: CONFLICT
                      message: email already exists
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login
      description: |
        email / password でログインする。

        認証成功時に user 情報、roles、access token、refresh token を返す。
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value:
                  email: alice@example.com
                  password: secret123
      responses:
        "200":
          description: Login success response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      user:
                        id: 1
                        name: Alice
                        email: alice@example.com
                        roles:
                          - customer
                      tokens:
                        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                        refreshToken: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                        tokenType: Bearer
                        expiresIn: 900
                    error: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: |
        refresh token を利用して、新しい access token を発行する。

        refresh token rotation は現時点では行わず、access token のみ返す。
      operationId: refreshAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
            examples:
              default:
                value:
                  refreshToken: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      responses:
        "200":
          description: Refresh success response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      tokenType: Bearer
                      expiresIn: 900
                    error: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      description: |
        refresh token を revoke してログアウトする。

        このAPIは access token による認証と customer role が必要。
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
            examples:
              default:
                value:
                  refreshToken: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      responses:
        "200":
          description: Logout success response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      message: logged out
                    error: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/me:
    get:
      tags:
        - Auth
      summary: Current user
      description: |
        ログイン中ユーザーの情報を取得する。

        このAPIは access token による認証と customer role が必要。
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      id: 1
                      name: Alice
                      email: alice@example.com
                      roles:
                        - customer
                    error: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/products:
    get:
      tags:
        - Products
      summary: Product list
      description: |
        公開中の商品一覧を取得する。

        現時点では active 商品の全件取得のみ対応する。
        検索、絞り込み、並び替え、pagination は後続Issueで追加する。
      operationId: listProducts
      responses:
        "200":
          description: Product list response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      - id: 1
                        name: HHKB Professional HYBRID Type-S
                        description: Compact keyboard with electrostatic capacitive switches.
                        priceIncludingTax: 39600
                        category:
                          id: 1
                          name: keyboard
                        status: active
                        stockStatus: in_stock
                        imageUrl: null
                        releasedAt: "2023-10-25"
                        makerName: PFU
                        modelNumber: PD-KB800BS
                    error: null
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/products/{id}:
    get:
      tags:
        - Products
      summary: Product detail
      description: |
        公開中の商品詳細を取得する。

        stopped 商品は存在しない商品と同じく 404 を返す。
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          description: Product ID
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Product detail response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      id: 1
                      name: HHKB Professional HYBRID Type-S
                      description: Compact keyboard with electrostatic capacitive switches.
                      priceIncludingTax: 39600
                      category:
                        id: 1
                        name: keyboard
                      status: active
                      stockStatus: in_stock
                      imageUrl: null
                      releasedAt: "2023-10-25"
                      makerName: PFU
                      modelNumber: PD-KB800BS
                    error: null
        "400":
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidProductId:
                  value:
                    data: null
                    error:
                      code: INVALID_REQUEST
                      message: invalid product id
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                productNotFound:
                  value:
                    data: null
                    error:
                      code: NOT_FOUND
                      message: product not found
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/products/{productId}/reviews:
    post:
      tags:
        - Reviews
      summary: Create review
      description: |
        ログインユーザーが購入済み商品にレビューを作成する。

        access token による認証と customer role が必要。
        対象商品が存在し、ログインユーザーが order_status = ordered の注文で対象商品を購入済みであることを確認する。
        1ユーザー1商品1レビューまで作成できる。
        作成時の status は draft とする。
      operationId: createReview
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          description: Product ID
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreateRequest"
            examples:
              default:
                value:
                  rating: 5
                  title: 良い商品
                  comment: 使いやすい
      responses:
        "201":
          description: Review created response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCreateSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      reviewId: 1
                      productId: 1
                      rating: 5
                      title: 良い商品
                      comment: 使いやすい
                      status: draft
                      createdAt: "2026-06-01T12:00:00Z"
                      updatedAt: "2026-06-01T12:00:00Z"
                    error: null
        "400":
          $ref: "#/components/responses/ReviewCreateRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/ReviewResourceNotFoundError"
        "409":
          $ref: "#/components/responses/ReviewAlreadyExistsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/cart:
    get:
      tags:
        - Cart
      summary: Cart detail
      description: |
        ログインユーザーのカート内容を取得する。

        access token による認証と customer role が必要。
        商品の価格、税率、在庫状態は取得時点の情報から計算する。
        maxSelectableQuantity は数量操作の上限制御用に返し、Phase1では現在在庫数と同値とする。
        frontend は maxSelectableQuantity を実在庫数として画面表示しない。
        購入不可となった商品もカートから自動削除せず返す。
      operationId: getCart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart detail response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      items:
                        - productId: 1
                          name: HHKB Professional HYBRID Type-S
                          imageUrl: null
                          priceIncludingTax: 39600
                          stockStatus: in_stock
                          quantity: 2
                          maxSelectableQuantity: 12
                          canBePurchased: true
                      totalAmount: 79200
                    error: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/CartResourceNotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/cart/items:
    post:
      tags:
        - Cart
      summary: Add cart item
      description: |
        商品をログインユーザーのカートへ追加する。

        access token による認証と customer role が必要。
        同じ商品が既に存在する場合は数量を加算する。
        active 商品のみ操作可能で、追加後の数量が在庫を超える操作は受け付けない。
        在庫不足の場合は、今回さらに追加可能な数量を availableQuantity として返す。
      operationId: addCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemAddRequest"
            examples:
              default:
                value:
                  productId: 1
                  quantity: 2
      responses:
        "200":
          description: Cart item added response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartMessageSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      message: cart item added
                    error: null
        "400":
          $ref: "#/components/responses/CartAddItemRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/CartResourceNotFoundError"
        "409":
          $ref: "#/components/responses/OutOfStockError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Cart
      summary: Delete all cart items
      description: |
        ログインユーザーのカート内商品をすべて物理削除する。

        access token による認証と customer role が必要。
        cart 自体は削除しない。
      operationId: deleteAllCartItems
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart items deleted response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartMessageSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      message: cart items deleted
                    error: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/CartResourceNotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/cart/items/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        description: Product ID
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags:
        - Cart
      summary: Update cart item quantity
      description: |
        ログインユーザーのカート内商品の数量を指定数量で上書きする。

        access token による認証と customer role が必要。
        active 商品のみ操作可能で、変更後の数量が在庫を超える操作は受け付けない。
        在庫不足の場合は、設定可能な最大数量を availableQuantity として返す。
      operationId: updateCartItemQuantity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemQuantityUpdateRequest"
            examples:
              default:
                value:
                  quantity: 3
      responses:
        "200":
          description: Cart item updated response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartMessageSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      message: cart item updated
                    error: null
        "400":
          $ref: "#/components/responses/CartUpdateItemRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/CartResourceNotFoundError"
        "409":
          $ref: "#/components/responses/OutOfStockError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Cart
      summary: Delete cart item
      description: |
        ログインユーザーのカートから指定商品を物理削除する。

        access token による認証と customer role が必要。
      operationId: deleteCartItem
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart item deleted response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartMessageSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      message: cart item deleted
                    error: null
        "400":
          $ref: "#/components/responses/InvalidProductIDError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/CartResourceNotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/orders:
    get:
      tags:
        - Orders
      summary: List orders
      description: |
        ログインユーザーの注文履歴一覧を取得する。

        access token による認証と customer role が必要。
        自分の注文のみを ordered_at DESC で返す。
        一覧では注文単位の概要と、order_items.quantity の合計である itemCount を返す。
      operationId: listOrders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Order list response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      orders:
                        - orderId: 1
                          orderNumber: ORD-20260530-A8K3D2
                          orderStatus: ordered
                          totalIncludingTax: 134000
                          orderedAt: "2026-05-30T12:00:00Z"
                          itemCount: 3
                    error: null
                empty:
                  value:
                    data:
                      orders: []
                    error: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Orders
      summary: Create order
      description: |
        ログインユーザーのCart内商品を注文確定する。

        access token による認証と customer role が必要。
        request body は持たない。
        Cartに残っている商品を一括で注文対象とし、部分成功は行わない。
        注文確定時点の商品状態、在庫、価格、税率を再確認する。
        成功時は同一transaction内で orders / order_items 作成、在庫減算、対象 cart_items 物理削除を行う。
      operationId: createOrder
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Order created response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreateSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      orderId: 1
                      orderNumber: ORD-20260528-A8K3D2
                      totalIncludingTax: 79200
                      orderedAt: "2026-05-28T12:00:00Z"
                      items:
                        - productId: 1
                          productName: HHKB Professional
                          productImageUrl: null
                          quantity: 2
                          unitPriceIncludingTax: 39600
                          subtotalIncludingTax: 79200
                    error: null
        "400":
          description: Empty cart or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emptyCart:
                  value:
                    data: null
                    error:
                      code: EMPTY_CART
                      message: cart is empty
                validationError:
                  value:
                    data: null
                    error:
                      code: VALIDATION_ERROR
                      message: validation error
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/OrderOutOfStockError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order detail
      description: |
        ログインユーザーの注文履歴詳細を取得する。

        access token による認証と customer role が必要。
        自分の注文のみ取得可能。
        order_items は注文時点のスナップショット情報を返し、Productの現在情報は表示用に利用しない。
        指定IDの注文が存在しない場合と、他ユーザーの注文IDを指定した場合はいずれも NOT_FOUND を返す。
      operationId: getOrderDetail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Order detail response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      orderId: 1
                      orderNumber: ORD-20260530-A8K3D2
                      orderStatus: ordered
                      totalExcludingTax: 121818
                      totalTax: 12182
                      totalIncludingTax: 134000
                      orderedAt: "2026-05-30T12:00:00Z"
                      items:
                        - productId: 1
                          productName: HHKB Professional
                          productImageUrl: null
                          makerName: PFU
                          modelNumber: PD-KB800
                          unitPriceExcludingTax: 36000
                          taxRate: 0.1
                          unitPriceIncludingTax: 39600
                          quantity: 2
                          subtotalExcludingTax: 72000
                          subtotalTax: 7200
                          subtotalIncludingTax: 79200
                    error: null
        "400":
          $ref: "#/components/responses/InvalidOrderIDError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/OrderNotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validationError:
              value:
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: validation error
                  details:
                    - field: email
                      code: INVALID_FORMAT
                      message: email is invalid
    InvalidProductIDError:
      description: Invalid product ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidProductId:
              value:
                data: null
                error:
                  code: INVALID_REQUEST
                  message: invalid product id
    InvalidOrderIDError:
      description: Invalid order ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidOrderId:
              value:
                data: null
                error:
                  code: INVALID_REQUEST
                  message: invalid order id
    CartAddItemRequestError:
      description: Invalid add item request or cart validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidRequestBody:
              value:
                data: null
                error:
                  code: INVALID_REQUEST
                  message: invalid request body
            missingProductId:
              value:
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: validation error
                  details:
                    - field: productId
                      code: REQUIRED
                      message: productId is required
            invalidQuantity:
              value:
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: validation error
                  details:
                    - field: quantity
                      code: OUT_OF_RANGE
                      message: quantity must be greater than zero
            productNotActive:
              value:
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: validation error
                  details:
                    - field: productId
                      code: INVALID_FORMAT
                      message: product is not available
    CartUpdateItemRequestError:
      description: Invalid quantity update request or cart validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidRequestBody:
              value:
                data: null
                error:
                  code: INVALID_REQUEST
                  message: invalid request body
            invalidProductId:
              value:
                data: null
                error:
                  code: INVALID_REQUEST
                  message: invalid product id
            invalidQuantity:
              value:
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: validation error
                  details:
                    - field: quantity
                      code: OUT_OF_RANGE
                      message: quantity must be greater than zero
            productNotActive:
              value:
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: validation error
                  details:
                    - field: productId
                      code: INVALID_FORMAT
                      message: product is not available
    CartResourceNotFoundError:
      description: Cart resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            cartNotFound:
              value:
                data: null
                error:
                  code: NOT_FOUND
                  message: cart not found
            productNotFound:
              value:
                data: null
                error:
                  code: NOT_FOUND
                  message: product not found
            cartItemNotFound:
              value:
                data: null
                error:
                  code: NOT_FOUND
                  message: cart item not found
    OutOfStockError:
      description: Cart quantity exceeds current stock
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            outOfStock:
              value:
                data: null
                error:
                  code: OUT_OF_STOCK
                  message: out of stock
                  details:
                    availableQuantity: 3
    OrderOutOfStockError:
      description: Order contains an out-of-stock item
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            outOfStock:
              value:
                data: null
                error:
                  code: OUT_OF_STOCK
                  message: out of stock
    OrderNotFoundError:
      description: Order not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            orderNotFound:
              value:
                data: null
                error:
                  code: NOT_FOUND
                  message: order not found
    ReviewCreateRequestError:
      description: Invalid review create request or validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidRequestBody:
              value:
                data: null
                error:
                  code: INVALID_REQUEST
                  message: invalid request body
            invalidProductId:
              value:
                data: null
                error:
                  code: INVALID_REQUEST
                  message: invalid product id
            invalidRating:
              value:
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: validation error
                  details:
                    - field: rating
                      code: OUT_OF_RANGE
                      message: rating must be between 1 and 5
            titleRequired:
              value:
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: validation error
                  details:
                    - field: title
                      code: REQUIRED
                      message: title is required when comment is provided
            notPurchased:
              value:
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: validation error
                  details:
                    - field: productId
                      code: INVALID_FORMAT
                      message: product has not been purchased
    ReviewResourceNotFoundError:
      description: Review target resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            productNotFound:
              value:
                data: null
                error:
                  code: NOT_FOUND
                  message: product not found
    ReviewAlreadyExistsError:
      description: Review already exists for the user and product
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            reviewAlreadyExists:
              value:
                data: null
                error:
                  code: CONFLICT
                  message: review already exists
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value:
                data: null
                error:
                  code: UNAUTHORIZED
                  message: unauthorized
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbidden:
              value:
                data: null
                error:
                  code: FORBIDDEN
                  message: forbidden
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internalServerError:
              value:
                data: null
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: internal server error
  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Alice
        email:
          type: string
          format: email
          maxLength: 255
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 128
          example: secret123
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 1
          example: secret123
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          example: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          example: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    AuthSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/AuthData"
        error:
          nullable: true
          example: null
    AccessTokenSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/AccessTokenData"
        error:
          nullable: true
          example: null
    LogoutSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/LogoutData"
        error:
          nullable: true
          example: null
    MeSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/AuthUser"
        error:
          nullable: true
          example: null
    AuthData:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        tokens:
          $ref: "#/components/schemas/TokenPair"
    AuthUser:
      type: object
      required:
        - id
        - name
        - email
        - roles
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Alice
        email:
          type: string
          format: email
          example: alice@example.com
        roles:
          type: array
          items:
            type: string
            enum:
              - customer
              - admin
          example:
            - customer
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Raw refresh token. DB stores only its hash.
          example: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        tokenType:
          type: string
          enum:
            - Bearer
          example: Bearer
        expiresIn:
          type: integer
          description: Access token TTL in seconds.
          example: 900
    AccessTokenData:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          enum:
            - Bearer
          example: Bearer
        expiresIn:
          type: integer
          description: Access token TTL in seconds.
          example: 900
    LogoutData:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: logged out
    ProductListSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        error:
          nullable: true
          example: null
    ProductSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/Product"
        error:
          nullable: true
          example: null
    CartItemAddRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          format: int64
          minimum: 1
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2
    CartItemQuantityUpdateRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 3
    CartSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/CartData"
        error:
          nullable: true
          example: null
    CartMessageSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/CartMessageData"
        error:
          nullable: true
          example: null
    ReviewCreateRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        title:
          type: string
          nullable: true
          example: 良い商品
        comment:
          type: string
          nullable: true
          example: 使いやすい
    ReviewCreateSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/Review"
        error:
          nullable: true
          example: null
    Review:
      type: object
      required:
        - reviewId
        - productId
        - rating
        - status
        - createdAt
        - updatedAt
      properties:
        reviewId:
          type: integer
          format: int64
          example: 1
        productId:
          type: integer
          format: int64
          example: 1
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        title:
          type: string
          nullable: true
          example: 良い商品
        comment:
          type: string
          nullable: true
          example: 使いやすい
        status:
          type: string
          enum:
            - draft
            - published
            - hidden
          example: draft
        createdAt:
          type: string
          format: date-time
          example: "2026-06-01T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-01T12:00:00Z"
    OrderCreateSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/OrderCreateData"
        error:
          nullable: true
          example: null
    OrderListSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/OrderListData"
        error:
          nullable: true
          example: null
    OrderListData:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
    OrderSummary:
      type: object
      required:
        - orderId
        - orderNumber
        - orderStatus
        - totalIncludingTax
        - orderedAt
        - itemCount
      properties:
        orderId:
          type: integer
          format: int64
          example: 1
        orderNumber:
          type: string
          pattern: "^ORD-[0-9]{8}-[A-Z0-9]{6}$"
          example: ORD-20260530-A8K3D2
        orderStatus:
          type: string
          enum:
            - ordered
            - canceled
          example: ordered
        totalIncludingTax:
          type: integer
          minimum: 0
          example: 134000
        orderedAt:
          type: string
          format: date-time
          example: "2026-05-30T12:00:00Z"
        itemCount:
          type: integer
          minimum: 0
          example: 3
    OrderDetailSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/OrderDetailData"
        error:
          nullable: true
          example: null
    OrderDetailData:
      type: object
      required:
        - orderId
        - orderNumber
        - orderStatus
        - totalExcludingTax
        - totalTax
        - totalIncludingTax
        - orderedAt
        - items
      properties:
        orderId:
          type: integer
          format: int64
          example: 1
        orderNumber:
          type: string
          pattern: "^ORD-[0-9]{8}-[A-Z0-9]{6}$"
          example: ORD-20260530-A8K3D2
        orderStatus:
          type: string
          enum:
            - ordered
            - canceled
          example: ordered
        totalExcludingTax:
          type: integer
          minimum: 0
          example: 121818
        totalTax:
          type: integer
          minimum: 0
          example: 12182
        totalIncludingTax:
          type: integer
          minimum: 0
          example: 134000
        orderedAt:
          type: string
          format: date-time
          example: "2026-05-30T12:00:00Z"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderDetailItem"
    OrderDetailItem:
      type: object
      required:
        - productId
        - productName
        - unitPriceExcludingTax
        - taxRate
        - unitPriceIncludingTax
        - quantity
        - subtotalExcludingTax
        - subtotalTax
        - subtotalIncludingTax
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        productName:
          type: string
          example: HHKB Professional
        productImageUrl:
          type: string
          nullable: true
          example: null
        makerName:
          type: string
          nullable: true
          example: PFU
        modelNumber:
          type: string
          nullable: true
          example: PD-KB800
        unitPriceExcludingTax:
          type: integer
          minimum: 0
          example: 36000
        taxRate:
          type: number
          format: double
          minimum: 0
          example: 0.1
        unitPriceIncludingTax:
          type: integer
          minimum: 0
          example: 39600
        quantity:
          type: integer
          minimum: 1
          example: 2
        subtotalExcludingTax:
          type: integer
          minimum: 0
          example: 72000
        subtotalTax:
          type: integer
          minimum: 0
          example: 7200
        subtotalIncludingTax:
          type: integer
          minimum: 0
          example: 79200
    OrderCreateData:
      type: object
      required:
        - orderId
        - orderNumber
        - totalIncludingTax
        - orderedAt
        - items
      properties:
        orderId:
          type: integer
          format: int64
          example: 1
        orderNumber:
          type: string
          pattern: "^ORD-[0-9]{8}-[A-Z0-9]{6}$"
          example: ORD-20260528-A8K3D2
        totalIncludingTax:
          type: integer
          minimum: 0
          example: 79200
        orderedAt:
          type: string
          format: date-time
          example: "2026-05-28T12:00:00Z"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderCreateItem"
    OrderCreateItem:
      type: object
      required:
        - productId
        - productName
        - quantity
        - unitPriceIncludingTax
        - subtotalIncludingTax
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        productName:
          type: string
          example: HHKB Professional
        productImageUrl:
          type: string
          nullable: true
          example: null
        quantity:
          type: integer
          minimum: 1
          example: 2
        unitPriceIncludingTax:
          type: integer
          minimum: 0
          example: 39600
        subtotalIncludingTax:
          type: integer
          minimum: 0
          example: 79200
    CartData:
      type: object
      required:
        - items
        - totalAmount
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        totalAmount:
          type: integer
          minimum: 0
          example: 79200
    CartItem:
      type: object
      required:
        - productId
        - name
        - priceIncludingTax
        - stockStatus
        - quantity
        - maxSelectableQuantity
        - canBePurchased
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: HHKB Professional HYBRID Type-S
        imageUrl:
          type: string
          nullable: true
          example: null
        priceIncludingTax:
          type: integer
          minimum: 0
          example: 39600
        stockStatus:
          type: string
          enum:
            - in_stock
            - low_stock
            - out_of_stock
          example: in_stock
        quantity:
          type: integer
          minimum: 1
          example: 2
        maxSelectableQuantity:
          type: integer
          minimum: 0
          description: |
            Quantity upper bound for cart quantity controls.
            In Phase1 this equals the current stock quantity, but must not be displayed as actual stock.
          example: 12
        canBePurchased:
          type: boolean
          example: true
    CartMessageData:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: cart item added
    ErrorResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          nullable: true
          example: null
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - VALIDATION_ERROR
            - CONFLICT
            - EMPTY_CART
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - OUT_OF_STOCK
            - INTERNAL_SERVER_ERROR
        message:
          type: string
        details:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/ErrorDetail"
            - $ref: "#/components/schemas/OutOfStockDetails"
    ErrorDetail:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    OutOfStockDetails:
      type: object
      required:
        - availableQuantity
      properties:
        availableQuantity:
          type: integer
          minimum: 0
          description: Quantity that can be applied by retrying the rejected Cart operation.
    Product:
      type: object
      required:
        - id
        - name
        - priceIncludingTax
        - category
        - status
        - stockStatus
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: HHKB Professional HYBRID Type-S
        description:
          type: string
          nullable: true
          example: Compact keyboard with electrostatic capacitive switches.
        priceIncludingTax:
          type: integer
          example: 39600
        category:
          $ref: "#/components/schemas/Category"
        status:
          type: string
          enum:
            - active
            - stopped
          example: active
        stockStatus:
          type: string
          enum:
            - in_stock
            - low_stock
            - out_of_stock
          example: in_stock
        imageUrl:
          type: string
          nullable: true
          example: null
        releasedAt:
          type: string
          format: date
          nullable: true
          example: "2023-10-25"
        makerName:
          type: string
          nullable: true
          example: PFU
        modelNumber:
          type: string
          nullable: true
          example: PD-KB800BS
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: keyboard
