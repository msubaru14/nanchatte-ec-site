openapi: 3.0.3
info:
  title: Nanchatte EC Site API
  version: 0.1.0
  description: |
    なんちゃってECサイトのAPI仕様。
    このファイルには実装済みAPIから順次追記する。
servers:
  - url: http://localhost:8080
    description: Local backend
tags:
  - name: Auth
    description: Authentication APIs
  - name: Products
    description: Public product APIs
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register user
      description: |
        ユーザー登録を行う。

        登録時に email を正規化し、password を hash 化して保存する。
        初期 role として customer を付与し、cart を作成する。
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              default:
                value:
                  name: Alice
                  email: alice@example.com
                  password: secret123
      responses:
        "201":
          description: Register success response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      user:
                        id: 1
                        name: Alice
                        email: alice@example.com
                        roles:
                          - customer
                      tokens:
                        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                        refreshToken: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                        tokenType: Bearer
                        expiresIn: 900
                    error: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailAlreadyExists:
                  value:
                    data: null
                    error:
                      code: CONFLICT
                      message: email already exists
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login
      description: |
        email / password でログインする。

        認証成功時に user 情報、roles、access token、refresh token を返す。
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value:
                  email: alice@example.com
                  password: secret123
      responses:
        "200":
          description: Login success response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      user:
                        id: 1
                        name: Alice
                        email: alice@example.com
                        roles:
                          - customer
                      tokens:
                        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                        refreshToken: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                        tokenType: Bearer
                        expiresIn: 900
                    error: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: |
        refresh token を利用して、新しい access token を発行する。

        refresh token rotation は現時点では行わず、access token のみ返す。
      operationId: refreshAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
            examples:
              default:
                value:
                  refreshToken: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      responses:
        "200":
          description: Refresh success response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      tokenType: Bearer
                      expiresIn: 900
                    error: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      description: |
        refresh token を revoke してログアウトする。

        このAPIは access token による認証と customer role が必要。
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
            examples:
              default:
                value:
                  refreshToken: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      responses:
        "200":
          description: Logout success response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      message: logged out
                    error: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/me:
    get:
      tags:
        - Auth
      summary: Current user
      description: |
        ログイン中ユーザーの情報を取得する。

        このAPIは access token による認証と customer role が必要。
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      id: 1
                      name: Alice
                      email: alice@example.com
                      roles:
                        - customer
                    error: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/products:
    get:
      tags:
        - Products
      summary: Product list
      description: |
        公開中の商品一覧を取得する。

        現時点では active 商品の全件取得のみ対応する。
        検索、絞り込み、並び替え、pagination は後続Issueで追加する。
      operationId: listProducts
      responses:
        "200":
          description: Product list response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      - id: 1
                        name: HHKB Professional HYBRID Type-S
                        description: Compact keyboard with electrostatic capacitive switches.
                        priceIncludingTax: 39600
                        category:
                          id: 1
                          name: keyboard
                        status: active
                        stockStatus: in_stock
                        imageUrl: null
                        releasedAt: "2023-10-25"
                        makerName: PFU
                        modelNumber: PD-KB800BS
                    error: null
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/products/{id}:
    get:
      tags:
        - Products
      summary: Product detail
      description: |
        公開中の商品詳細を取得する。

        stopped 商品は存在しない商品と同じく 404 を返す。
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          description: Product ID
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Product detail response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      id: 1
                      name: HHKB Professional HYBRID Type-S
                      description: Compact keyboard with electrostatic capacitive switches.
                      priceIncludingTax: 39600
                      category:
                        id: 1
                        name: keyboard
                      status: active
                      stockStatus: in_stock
                      imageUrl: null
                      releasedAt: "2023-10-25"
                      makerName: PFU
                      modelNumber: PD-KB800BS
                    error: null
        "400":
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidProductId:
                  value:
                    data: null
                    error:
                      code: INVALID_REQUEST
                      message: invalid product id
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                productNotFound:
                  value:
                    data: null
                    error:
                      code: NOT_FOUND
                      message: product not found
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validationError:
              value:
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: validation error
                  details:
                    - field: email
                      code: INVALID_FORMAT
                      message: email is invalid
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value:
                data: null
                error:
                  code: UNAUTHORIZED
                  message: unauthorized
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbidden:
              value:
                data: null
                error:
                  code: FORBIDDEN
                  message: forbidden
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internalServerError:
              value:
                data: null
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: internal server error
  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Alice
        email:
          type: string
          format: email
          maxLength: 255
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 128
          example: secret123
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 1
          example: secret123
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          example: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          example: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    AuthSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/AuthData"
        error:
          nullable: true
          example: null
    AccessTokenSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/AccessTokenData"
        error:
          nullable: true
          example: null
    LogoutSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/LogoutData"
        error:
          nullable: true
          example: null
    MeSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/AuthUser"
        error:
          nullable: true
          example: null
    AuthData:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        tokens:
          $ref: "#/components/schemas/TokenPair"
    AuthUser:
      type: object
      required:
        - id
        - name
        - email
        - roles
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Alice
        email:
          type: string
          format: email
          example: alice@example.com
        roles:
          type: array
          items:
            type: string
            enum:
              - customer
              - admin
          example:
            - customer
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Raw refresh token. DB stores only its hash.
          example: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        tokenType:
          type: string
          enum:
            - Bearer
          example: Bearer
        expiresIn:
          type: integer
          description: Access token TTL in seconds.
          example: 900
    AccessTokenData:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          enum:
            - Bearer
          example: Bearer
        expiresIn:
          type: integer
          description: Access token TTL in seconds.
          example: 900
    LogoutData:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: logged out
    ProductListSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        error:
          nullable: true
          example: null
    ProductSuccessResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: "#/components/schemas/Product"
        error:
          nullable: true
          example: null
    ErrorResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          nullable: true
          example: null
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - VALIDATION_ERROR
            - CONFLICT
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - INTERNAL_SERVER_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Product:
      type: object
      required:
        - id
        - name
        - priceIncludingTax
        - category
        - status
        - stockStatus
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: HHKB Professional HYBRID Type-S
        description:
          type: string
          nullable: true
          example: Compact keyboard with electrostatic capacitive switches.
        priceIncludingTax:
          type: integer
          example: 39600
        category:
          $ref: "#/components/schemas/Category"
        status:
          type: string
          enum:
            - active
            - stopped
          example: active
        stockStatus:
          type: string
          enum:
            - in_stock
            - low_stock
            - out_of_stock
          example: in_stock
        imageUrl:
          type: string
          nullable: true
          example: null
        releasedAt:
          type: string
          format: date
          nullable: true
          example: "2023-10-25"
        makerName:
          type: string
          nullable: true
          example: PFU
        modelNumber:
          type: string
          nullable: true
          example: PD-KB800BS
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: keyboard
